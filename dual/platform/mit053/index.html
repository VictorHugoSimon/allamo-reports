<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dual · MIT053</title><link rel="stylesheet" href="../shared.css"></head><body><div class="wrap"><div class="hero"><div class="ey">Instituto Államo · PMO</div><h1>MIT053 · Roteiro de Carga</h1><div class="sub">Visão viva dos objetos de conversão rastreados no Plano de Ação.</div></div><div id="nav"></div><div class="panel"><div class="note">Cada objeto do MIT053 possui ação própria. Campos sem evidência permanecem como PENDENTE DE VALIDAÇÃO.</div><div id="k" class="cards" style="margin-top:12px"></div><div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>PA</th><th>Objeto</th><th>Responsável</th><th>Status</th><th>Dependência</th><th>Próximo passo</th><th>Evidência</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script src="../config.js"></script><script src="../shared.js"></script><script>document.getElementById('nav').innerHTML=DualPMO.nav('Portal');(async()=>{const a=await DualPMO.db(`/rest/v1/action_items?project_id=eq.${DUAL_DB.projectId}&front=eq.Carga%20de%20Dados%20%2F%20MIT053&deleted_at=is.null&select=*&order=action_code.asc`);const c=s=>a.filter(x=>x.status===s).length;document.getElementById('k').innerHTML=[['Objetos',a.length],['Planejado',c('Planejado')],['Em andamento',c('Em andamento')],['Atrasado',c('Atrasado')],['Concluído',c('Concluído')]].map(x=>`<div class="card"><h3>${x[0]}</h3><p style="font-size:28px;font-weight:900">${x[1]}</p></div>`).join('');document.getElementById('rows').innerHTML=a.map(x=>`<tr><td><b>${DualPMO.esc(x.action_code)}</b></td><td>${DualPMO.esc(x.title)}</td><td>${DualPMO.esc(x.owner||'PENDENTE DE VALIDAÇÃO')}</td><td>${DualPMO.tag(x.status)}</td><td>${DualPMO.esc(x.dependency||'')}</td><td>${DualPMO.esc(x.next_step||'')}</td><td>${DualPMO.esc(x.evidence||'')}</td></tr>`).join('')})().catch(e=>alert(e.message))</script></body></html>

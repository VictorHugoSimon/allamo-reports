<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dual · Cadastro e Saneamento</title><link rel="stylesheet" href="../shared.css"></head><body><div class="wrap"><div class="hero"><div class="ey">Instituto Államo · PMO</div><h1>Cadastro Mestre · Saneamento Protheus</h1><div class="sub">Visão viva de cadastro, matérias-primas, produtos, fichas técnicas e preparação de dados.</div></div><div id="nav"></div><div class="panel"><div id="k" class="cards"></div><div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>PA</th><th>Frente</th><th>Ação</th><th>Responsável</th><th>Status</th><th>Prazo</th><th>Próximo passo</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script src="../config.js"></script><script src="../shared.js"></script><script>document.getElementById('nav').innerHTML=DualPMO.nav('Portal');(async()=>{const all=await DualPMO.db(`/rest/v1/action_items?project_id=eq.${DUAL_DB.projectId}&deleted_at=is.null&select=*&order=action_code.asc`);const a=all.filter(x=>/cadastro|matéria|materia|ficha|produto|dados/i.test(x.front+' '+x.title));const c=s=>a.filter(x=>x.status===s).length;document.getElementById('k').innerHTML=[['Ações relacionadas',a.length],['Em andamento',c('Em andamento')],['Atrasado',c('Atrasado')],['Concluído',c('Concluído')]].map(x=>`<div class="card"><h3>${x[0]}</h3><p style="font-size:28px;font-weight:900">${x[1]}</p></div>`).join('');document.getElementById('rows').innerHTML=a.map(x=>`<tr><td><b>${DualPMO.esc(x.action_code)}</b></td><td>${DualPMO.esc(x.front)}</td><td>${DualPMO.esc(x.title)}</td><td>${DualPMO.esc(x.owner||'A confirmar')}</td><td>${DualPMO.tag(x.status)}</td><td>${DualPMO.fmt(x.due_date)||'A confirmar'}</td><td>${DualPMO.esc(x.next_step||'')}</td></tr>`).join('')})().catch(e=>alert(e.message))</script></body></html>

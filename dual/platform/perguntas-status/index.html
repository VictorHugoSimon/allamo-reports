<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dual · Perguntas para Status</title><link rel="stylesheet" href="../shared.css"></head><body><div class="wrap"><div class="hero"><div class="ey">Instituto Államo · PMO</div><h1>Perguntas & Pendências para Status</h1><div class="sub">Questões gerenciais derivadas das ações atrasadas, críticas ou pendentes de validação.</div></div><div id="nav"></div><div class="panel"><div class="tablewrap"><table><thead><tr><th>PA</th><th>Pergunta / ponto a validar</th><th>Responsável</th><th>Prazo</th><th>Status</th><th>Próximo passo</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script src="../config.js"></script><script src="../shared.js"></script><script>document.getElementById('nav').innerHTML=DualPMO.nav('Portal');(async()=>{const a=await DualPMO.db(`/rest/v1/action_items?project_id=eq.${DUAL_DB.projectId}&deleted_at=is.null&select=*&order=action_code.asc`);const q=a.filter(x=>x.status==='Atrasado'||x.critical||/PENDENTE DE VALIDAÇÃO/i.test([x.owner,x.dependency,x.next_step,x.evidence].join(' ')));document.getElementById('rows').innerHTML=q.map(x=>`<tr><td><b>${DualPMO.esc(x.action_code)}</b></td><td>${DualPMO.esc(x.title)}</td><td>${DualPMO.esc(x.owner||'PENDENTE DE VALIDAÇÃO')}</td><td>${DualPMO.fmt(x.due_date)||'A confirmar'}</td><td>${DualPMO.tag(x.status)}</td><td>${DualPMO.esc(x.next_step||'A confirmar')}</td></tr>`).join('')})().catch(e=>alert(e.message))</script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dual · RFI</title><link rel="stylesheet" href="../shared.css"></head><body><div class="wrap"><div class="hero"><div class="ey">Instituto Államo · PMO</div><h1>RFI · Validação do Projeto</h1><div class="sub">Controle formal do RFI previsto no escopo de governança.</div></div><div id="nav"></div><div class="panel" id="content"></div></div><script src="../config.js"></script><script src="../shared.js"></script><script>document.getElementById('nav').innerHTML=DualPMO.nav('Portal');(async()=>{const a=(await DualPMO.db(`/rest/v1/action_items?project_id=eq.${DUAL_DB.projectId}&action_code=eq.PA-211&deleted_at=is.null&select=*`))[0];document.getElementById('content').innerHTML=a?`<div class="toolbar"><b>${DualPMO.esc(a.action_code)}</b>${DualPMO.tag(a.status)}</div><h2>${DualPMO.esc(a.title)}</h2><p><b>Responsável:</b> ${DualPMO.esc(a.owner||'A confirmar')}</p><p><b>Prazo:</b> ${DualPMO.fmt(a.due_date)||'A confirmar'}</p><p><b>Próximo passo:</b> ${DualPMO.esc(a.next_step||'A confirmar')}</p><p><b>Fonte/Evidência:</b> ${DualPMO.esc(a.evidence||'Sem evidência suficiente')}</p><div class="note">Enquanto o documento RFI vigente não for localizado e validado, não deve ser tratado como concluído. Se não se aplicar, registrar formalmente a não aplicabilidade.</div>`:'<div class="note">PA-211 não localizada.</div>'})().catch(e=>alert(e.message))</script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dual · Intercompany</title><link rel="stylesheet" href="../shared.css"></head><body><div class="wrap"><div class="hero"><div class="ey">Instituto Államo · PMO</div><h1>Intercompany · Origem/Cyclone ↔ Dual</h1><div class="sub">Rastreabilidade da customização, papéis e tarefas vinculadas.</div></div><div id="nav"></div><div class="panel"><div id="meta" class="cards"></div></div><div class="panel"><h2>Tarefas relacionadas</h2><div class="tablewrap"><table><thead><tr><th>Etapa</th><th>PA</th><th>Ação</th><th>Status</th><th>Responsável</th><th>Próximo passo</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script src="../config.js"></script><script src="../shared.js"></script><script>document.getElementById('nav').innerHTML=DualPMO.nav('Portal');(async()=>{const m=(await DualPMO.db(`/rest/v1/customizations?project_id=eq.${DUAL_DB.projectId}&code=eq.INTERCOMPANY&deleted_at=is.null&select=*`))[0];if(!m)throw new Error('Intercompany não encontrado');document.getElementById('meta').innerHTML=[['Assunto',m.subject],['Situação',m.signature_status],['Validação Dual',m.dual_validation],['Usuários-chave',m.key_user],['TOTVS Funcional',m.totvs_functional],['PMO',m.pmo_owner]].map(x=>`<div class="card"><h3>${DualPMO.esc(x[0])}</h3><p>${DualPMO.esc(x[1]||'PENDENTE DE VALIDAÇÃO')}</p></div>`).join('');const links=await DualPMO.db(`/rest/v1/customization_actions?customization_id=eq.${m.id}&select=action_id,stage`);const ids=links.map(x=>x.action_id);const acts=ids.length?await DualPMO.db(`/rest/v1/action_items?id=in.(${ids.join(',')})&select=*`):[];const by=Object.fromEntries(acts.map(x=>[x.id,x]));document.getElementById('rows').innerHTML=links.map(l=>{const a=by[l.action_id]||{};return `<tr><td>${DualPMO.esc(l.stage)}</td><td>${DualPMO.esc(a.action_code||'')}</td><td>${DualPMO.esc(a.title||'')}</td><td>${DualPMO.tag(a.status||'A confirmar')}</td><td>${DualPMO.esc(a.owner||'A confirmar')}</td><td>${DualPMO.esc(a.next_step||'')}</td></tr>`}).join('')})().catch(e=>alert(e.message))</script></body></html>

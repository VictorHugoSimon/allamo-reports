<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dual · Documentos</title><link rel="stylesheet" href="../shared.css"></head><body><div class="wrap"><div class="hero"><div class="ey">Instituto Államo · PMO</div><h1>Gestão Documental</h1><div class="sub">Documentos, versão vigente, responsável, origem, status e referência no Git/Drive.</div></div><div id="nav"></div><div class="panel"><div class="toolbar"><button id="new" class="btn primary">+ Novo documento</button><button id="reload" class="btn">Atualizar</button><input id="search" placeholder="Buscar documento..."><span id="state" class="statusline"></span></div><div class="note">Padrão recomendado: DUAL_[TIPO]_[ASSUNTO]_vX.Y_YYYY-MM-DD. Evitar nomes como final2 ou ultima-versao.</div><div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>Código</th><th>Documento</th><th>Tipo</th><th>Versão</th><th>Responsável</th><th>Data</th><th>Status</th><th>URL</th><th>Ação</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><div id="modal" class="modal"><div class="box"><button id="close" class="btn" style="float:right">Fechar</button><h2>Documento</h2><div id="form" class="formgrid"></div><div class="toolbar"><button id="save" class="btn primary">Salvar</button></div></div></div><script src="../config.js"></script><script src="../shared.js"></script><script>DualPMO.initCrud({active:'Documentos',table:'project_documents',order:'document_code.asc',columns:[{key:'document_code'},{key:'name'},{key:'document_type'},{key:'current_version'},{key:'owner'},{key:'document_date',format:v=>DualPMO.fmt(v)},{key:'status',tag:true},{key:'url'}],fields:[{key:'document_code',label:'Código'},{key:'name',label:'Documento'},{key:'document_type',label:'Tipo'},{key:'current_version',label:'Versão vigente'},{key:'owner',label:'Responsável'},{key:'document_date',label:'Data',type:'date'},{key:'origin',label:'Origem'},{key:'status',l

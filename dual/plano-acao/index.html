</style></head><body><div class="wrap"><div class="hero"><div class="ey">Instituto Államo · PMO</div><h1>Plano de Ação Oficial · Dual Clima</h1><div class="sub">Fonte central de gestão do projeto · link permanente · atualização publicada em 28/08/2026</div></div><div id="k" class="kpis"></div><div class="tools"><input id="q" placeholder="Buscar ID, ação, responsável, frente..."><select id="f"><option value="">Todas as frentes</option></select><select id="o"><option value="">Todos os responsáveis</option></select><select id="c"><option value="">Todos</option><option value="Sim">Somente críticos</option><option value="Não">Não críticos</option></select><select id="v"><option value="">Todas as ações</option><option value="dual">Visão Dual</option><option value="totvs">Visão TOTVS</option><option value="late">Atrasadas</option><option value="7d">Próximos 7 dias</option><option value="15d">Próximos 15 dias</option></select><button onclick="clearAll()">Limpar</button></div><div class="statusbar" id="status"></div><div class="bar"><button onclick="csv()">Exportar filtrado CSV</button><span id="count" class="muted"></span></div><div class="card"><table><thead id="h"></thead><tbody id="b"></tbody></table></div><div class="foot">Este endereço mostra somente o Plano de Ação Oficial da Dual. Nenhum dado do MIT053 é carregado nesta página.</div></div><div id="m" class="modal"><div class="box"><button style="float:right" onclick="closeM()">Fechar</button><h2 id="mt"></h2><dl id="mb" class="grid"></dl></div></div><script>
let D=[],F=[],sc=0,sa=1;const E=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));const N=x=>String(x??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();const B=s=>`<span class="badge ${E(String(s).replaceAll(" ",""))}">${E(s)}</span>`;

function R(){let q=N(document.getElementById("q").value),fr=f.value,ow=o.value,cr=c.value,vi=v.value,st=statuses(),now=new Date(2026,7,28);F=D.filter(x=>{if(q&&!N(Object.values(x).join(" ")).includes(q))return false;if(fr&&x.Frente!==fr)return false;if(ow&&x.Responsável!==ow)return false;if(cr&&x["Caminho Crítico"]!==cr)return false;if(st.length&&!st.includes(x.Status))return false;let own=N(x.Responsável),du=date(x.Prazo);if(vi==="dual"&&!/(dual|luiz|carlao|produc|financeiro|comercial|compras|fiscal|key user)/.test(own))return false;if(vi==="totvs"&&!own.includes("totvs"))return false;if(vi==="late"&&x.Status!=="Atrasado")return false;if(vi==="7d"||vi==="15d"){if(x.Status==="Concluído"||!du)return false;let z=new Date(now);z.setDate(z.getDate()+(vi==="7d"?7:15));if(du>z)return false}return true});F.sort((a,b)=>String(a[H[sc]]??"").localeCompare(String(b[H[sc]]??""),"pt-BR",{numeric:true})*sa);draw()}
let H=[];
function draw(){h.innerHTML="<tr>"+H.map((x,i)=>`<th onclick="sort(${i})">${E(x)} ⇅</th>`).join("")+"</tr>";b.innerHTML=F.map(x=>"<tr onclick=\"openM('"+E(x.ID)+"')\" style=\"cursor:pointer\">"+H.map((k,i)=>`<td>${k==="Status"?B(x[k]):E(x[k])}</td>`).join("")+"</tr>").join("");count.textContent=`${F.length} ação(ões) exibida(s)`}
function sort(i){if(sc===i)sa*=-1;else{sc=i;sa=1}R()}

Promise.all(["actions-1.json","actions-2.json","actions-3.json","actions-4.json","actions-5.json","actions-6.json","actions-7.json","actions-8.json","actions-9.json","actions-10.json","actions-11.json","actions-12.json"].map(x=>fetch(x).then(r=>r.json()))).then(a=>{D=a.flat().sort((a,b)=>a.ID.localeCompare(b.ID));H=Object.keys(D[0]);fill("f",1);fill("o",3);["Planejado","Em andamento","Atrasado","Concluído"].forEach(x=>status.insertAdjacentHTML("beforeend",`<label class="chip"><input type="checkbox" value="${x}"> ${x}</label>`));["q","f","o","c","v"].forEach(id=>document.getElementById(id).oninput=R);status.onchange=R;let n={};D.forEach(x=>n[x.Status]=(n[x.Status]||0)+1);k.innerHTML=[["Total",D.length],["Planejado",n["Planejado"]||0],["Em andamento",n["Em andamento"]||0],["Atrasado",n["Atrasado"]||0],["Concluído",n["Concluído"]||0]].map(x=>`<div class="k"><b>${x[1]}</b><span>${x[0]}</span></div>`).join("");R()});
</script></body></html>
